name: run_dbt_prod

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  DBT_PROFILES_DIR: ./nyc_parking_violation
  DBT_PROJECT_DIR: ./nyc_parking_violation

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-pyton@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [-f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run dbt prod
      run: |
        dbt debug
        dbt compile --target prod
        dbt run --target prod
    - name: Test dbt prod
      run: |
        dbt test --target prod